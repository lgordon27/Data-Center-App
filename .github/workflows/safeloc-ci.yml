name: SafeLoc CI

on:
  pull_request:
    paths:
      - "artifacts/safeloc-diligence-workbench/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/safeloc-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      RESEARCH_CACHE_DIR: ${{ runner.temp }}/safeloc-research-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SafeLoc
        run: pnpm --dir artifacts/safeloc-diligence-workbench test

      - name: Typecheck SafeLoc
        run: pnpm --dir artifacts/safeloc-diligence-workbench typecheck

      - name: Build SafeLoc
        run: pnpm --dir artifacts/safeloc-diligence-workbench build
